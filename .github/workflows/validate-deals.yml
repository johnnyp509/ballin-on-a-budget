name: Validate deal data

on:
  pull_request:
    paths:
      - 'data/deals.json'
      - 'index.html'
      - 'scripts/validate-deals.mjs'
      - '.github/workflows/validate-deals.yml'
  push:
    paths:
      - 'data/deals.json'
      - 'index.html'
      - 'scripts/validate-deals.mjs'
      - '.github/workflows/validate-deals.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate canonical data and embedded fallback
        run: node scripts/validate-deals.mjs
      - name: Smoke-test inline scripts and schedule helpers
        run: node scripts/smoke-test-app.mjs
