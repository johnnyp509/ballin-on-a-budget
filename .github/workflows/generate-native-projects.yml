name: Generate native iOS and Android projects

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to generate native projects on
        required: true
        default: mobile/capacitor-foundation-oct-2026
        type: string

permissions:
  contents: write

concurrency:
  group: native-scaffold-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: macos-15
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools, platforms;android-36, build-tools;36.0.0'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Build web assets
        run: npm run build:web

      - name: Generate native platform projects
        run: |
          npx cap add android
          npx cap add ios

      - name: Generate native icons and synchronize platforms
        run: |
          npm run assets:generate:native
          npx cap sync

      - name: Build Android debug app
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO

      - name: Commit generated native projects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios package-lock.json
          if git diff --cached --quiet; then
            echo "No generated native project changes to commit."
          else
            git commit -m "build: generate native iOS and Android projects"
            git push origin "HEAD:${{ inputs.branch }}"
          fi
